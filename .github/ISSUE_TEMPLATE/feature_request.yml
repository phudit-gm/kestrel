name: Suggestion
description: An idea for a new feature or a change
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What problem does it solve
      description: What were you trying to do when you missed it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
